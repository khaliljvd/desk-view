  go.disabled=true;go.textContent='Opening…';err.textContent='';
  derive(document.getElementById('pw').value).then(function(k){return open_(k).then(function(pt){
    if(!rem)return pt;
    return crypto.subtle.exportKey('raw',k).then(function(raw){try{localStorage.setItem(K,u64(raw));}catch(x){}return pt;});});})
  .then(render).catch(function(){go.disabled=false;go.textContent='Open';err.textContent='That passphrase did not open the page.';});});
</script></body></html>
